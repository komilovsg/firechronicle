<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="t d"><title id="t">How FireChronicle works</title><desc id="d">Pipeline: NASA FIRMS, clean, H3 grid, calibrate, pooled estimate, static web app.</desc><rect width="1200" height="560" rx="24" fill="#0e1217"/><rect x="50" y="60" width="330" height="190" rx="16" fill="#161c24" stroke="#2a333f" stroke-width="2"/><circle cx="90" cy="104" r="20" fill="#ff7a2e"/><text x="90" y="112" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="24" font-weight="800" fill="#0e1217">1</text><text x="126" y="114" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="28" font-weight="700" fill="#f3efe8">NASA FIRMS</text><text x="78" y="162" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="22" fill="#97a3b0">MODIS + 3× VIIRS</text><text x="78" y="192" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="22" fill="#97a3b0">6.3 M raw rows</text><rect x="435" y="60" width="330" height="190" rx="16" fill="#161c24" stroke="#2a333f" stroke-width="2"/><circle cx="475" cy="104" r="20" fill="#ff7a2e"/><text x="475" y="112" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="24" font-weight="800" fill="#0e1217">2</text><text x="511" y="114" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="28" font-weight="700" fill="#f3efe8">Clean</text><text x="463" y="162" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="22" fill="#97a3b0">vegetation fires only</text><text x="463" y="192" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="22" fill="#97a3b0">confidence filter,</text><text x="463" y="222" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="22" fill="#97a3b0">static sources out</text><rect x="820" y="60" width="330" height="190" rx="16" fill="#161c24" stroke="#2a333f" stroke-width="2"/><circle cx="860" cy="104" r="20" fill="#ff7a2e"/><text x="860" y="112" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="24" font-weight="800" fill="#0e1217">3</text><text x="896" y="114" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="28" font-weight="700" fill="#f3efe8">H3 grid</text><text x="848" y="162" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="22" fill="#97a3b0">resolution 5, ~253 km²</text><text x="848" y="192" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="22" fill="#97a3b0">monthly counts</text><rect x="50" y="310" width="330" height="190" rx="16" fill="#161c24" stroke="#2a333f" stroke-width="2"/><circle cx="90" cy="354" r="20" fill="#ff7a2e"/><text x="90" y="362" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="24" font-weight="800" fill="#0e1217">4</text><text x="126" y="364" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="28" font-weight="700" fill="#f3efe8">Calibrate</text><text x="78" y="412" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="22" fill="#97a3b0">k per country × month</text><text x="78" y="442" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="22" fill="#97a3b0">shrunk, SP years only</text><rect x="435" y="310" width="330" height="190" rx="16" fill="#161c24" stroke="#2a333f" stroke-width="2"/><circle cx="475" cy="354" r="20" fill="#ff7a2e"/><text x="475" y="362" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="24" font-weight="800" fill="#0e1217">5</text><text x="511" y="364" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="28" font-weight="700" fill="#f3efe8">Pooled estimate</text><text x="463" y="412" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="22" fill="#f3efe8">(M + ΣV) / (1 + Σk)</text><text x="463" y="442" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="22" fill="#97a3b0">MODIS-equivalent</text><rect x="820" y="310" width="330" height="190" rx="16" fill="#161c24" stroke="#ff7a2e" stroke-width="3"/><circle cx="860" cy="354" r="20" fill="#ff7a2e"/><text x="860" y="362" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="24" font-weight="800" fill="#0e1217">6</text><text x="896" y="364" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="28" font-weight="700" fill="#f3efe8">Static web app</text><text x="848" y="412" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="22" fill="#97a3b0">calendar, map,</text><text x="848" y="442" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="22" fill="#97a3b0">CSV downloads</text><path d="M392 155.0 L423 155.0 M411 145.0 L423 155.0 L411 165.0" fill="none" stroke="#97a3b0" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M777 155.0 L808 155.0 M796 145.0 L808 155.0 L796 165.0" fill="none" stroke="#97a3b0" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M392 405.0 L423 405.0 M411 395.0 L423 405.0 L411 415.0" fill="none" stroke="#97a3b0" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M777 405.0 L808 405.0 M796 395.0 L808 405.0 L796 415.0" fill="none" stroke="#97a3b0" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M985.0 256 L985.0 280 L215.0 280 L215.0 296 M205.0 284 L215.0 296 L225.0 284" fill="none" stroke="#97a3b0" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>