<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="t d"><title id="t">Naive stitching reverses the trend</title><desc id="d">Annual fire detections in Central Asia, 2001 to 2025. Naive stitching shows +60% after 2012, harmonized and MODIS-only show -54%.</desc><rect width="1200" height="700" rx="24" fill="#f7f4ee"/><text x="60" y="84" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="26" font-weight="600" fill="#58626d">Central Asia, active fires per year</text><text x="60" y="152" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="52" font-weight="800" fill="#c2410c">Naive stitching +60%</text><line x1="60" y1="138" x2="600" y2="138" stroke="#c2410c" stroke-width="5"/><text x="660" y="152" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="52" font-weight="800" fill="#00336f">Harmonized −54%</text><text x="60" y="190" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="22" fill="#58626d">wrong: reverses the trend</text><text x="660" y="190" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="22" fill="#58626d">matches MODIS alone</text><line x1="130" y1="610.0" x2="1130" y2="610.0" stroke="#e4ded2" stroke-width="2"/><text x="116" y="617.0" text-anchor="end" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="20" fill="#58626d">0</text><line x1="130" y1="462.0" x2="1130" y2="462.0" stroke="#e4ded2" stroke-width="2"/><text x="116" y="469.0" text-anchor="end" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="20" fill="#58626d">100k</text><line x1="130" y1="314.0" x2="1130" y2="314.0" stroke="#e4ded2" stroke-width="2"/><text x="116" y="321.0" text-anchor="end" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="20" fill="#58626d">200k</text><text x="130.0" y="644" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="20" fill="#58626d">2001</text><text x="338.33333333333337" y="644" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="20" fill="#58626d">2006</text><text x="588.3333333333333" y="644" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="20" fill="#58626d">2012</text><text x="838.3333333333334" y="644" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="20" fill="#58626d">2018</text><text x="1130.0" y="644" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="20" fill="#58626d">2025</text><line x1="588.3333333333333" y1="234" x2="588.3333333333333" y2="610" stroke="#58626d" stroke-width="2" stroke-dasharray="6 6"/><text x="576.3333333333333" y="258" text-anchor="end" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="20" fill="#16191d">VIIRS S-NPP starts</text><path d="M130.0 506.8 L171.7 443.1 L213.3 458.3 L255.0 467.3 L296.7 506.6 L338.3 497.4 L380.0 528.5 L421.7 501.0 L463.3 549.2 L505.0 522.5 L546.7 572.1 L588.3 533.9 L630.0 581.5 L671.7 551.7 L713.3 551.7 L755.0 574.5 L796.7 508.3 L838.3 566.1 L880.0 536.0 L921.7 554.8 L963.3 562.0 L1005.0 577.1 L1046.7 585.4 L1088.3 597.4 L1130.0 581.1" fill="none" stroke="#00336f" stroke-width="6" stroke-linejoin="round" stroke-linecap="round"/><path d="M130.0 506.8 L171.7 443.1 L213.3 458.3 L255.0 467.3 L296.7 506.6 L338.3 497.4 L380.0 528.5 L421.7 501.0 L463.3 549.2 L505.0 522.5 L546.7 572.1 L588.3 359.5 L630.0 512.0 L671.7 406.1 L713.3 406.7 L755.0 488.6 L796.7 256.4 L838.3 457.4 L880.0 352.5 L921.7 422.6 L963.3 437.7 L1005.0 496.3 L1046.7 520.8 L1088.3 563.6 L1130.0 506.2" fill="none" stroke="#c2410c" stroke-width="6" stroke-linejoin="roun