<style>
:root{--bg:#eef1f5;--ink:#121922;--ink2:#3f4b5b;--line:rgba(20,30,45,.16);--ember:#b94a07;--star:#5d6a7b;--surf:#fff}
@media (prefers-color-scheme:dark){:root{--bg:#0b0f14;--ink:#e9eef5;--ink2:#b2bdcb;--line:rgba(170,195,225,.2);--ember:#ff7d33;--star:#8996a7;--surf:#121821}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:400 16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:grid;place-items:center;padding:24px;overflow-x:hidden}
main{display:grid;justify-items:center;gap:14px;text-align:center;max-width:560px;position:relative}
.stars i{position:fixed;width:3px;height:3px;border-radius:50%;background:var(--star);opacity:.5;animation:tw 3.4s ease-in-out infinite}
.stars i:nth-child(1){left:12%;top:18%}.stars i:nth-child(2){left:82%;top:24%;animation-delay:.8s}.stars i:nth-child(3){left:24%;top:72%;animation-delay:1.6s}.stars i:nth-child(4){left:70%;top:80%;animation-delay:2.2s}.stars i:nth-child(5){left:50%;top:10%;animation-delay:1.1s}
.em{width:150px;height:150px;animation:drift 7s ease-in-out infinite}
.em svg{width:100%;height:100%;overflow:visible}
.orb{transform-origin:75px 75px;animation:spin 24s linear infinite}
.eye{transform-origin:75px 75px;animation:blink 4s ease-in-out infinite}
h1{margin:0;font:800 clamp(64px,14vw,112px)/1 ui-monospace,"SF Mono",Menlo,Consolas,monospace;letter-spacing:.04em}
.sub{margin:0;font:600 13px ui-monospace,Menlo,Consolas,monospace;letter-spacing:.3em;color:var(--ember)}
p.msg{margin:6px 0 4px;font-size:17px;color:var(--ink2)}
.btn{display:inline-block;padding:12px 24px;border-radius:10px;background:var(--ember);color:var(--bg);font-weight:700;text-decoration:none;border:1px solid var(--ember)}
.btn:hover{filter:brightness(1.08)}.btn:focus-visible,a:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
nav{display:flex;flex-wrap:wrap;gap:6px 18px;justify-content:center;margin-top:6px;font-size:14px}
nav a{color:var(--ink2);text-decoration:underline;text-underline-offset:3px}nav a:hover{color:var(--ink)}
footer{margin-top:18px;font:500 11px ui-monospace,Menlo,Consolas,monospace;letter-spacing:.05em;color:var(--ink2);opacity:.8}
@keyframes drift{0%,100%{transform:translate(0,0) rotate(-4deg)}50%{transform:translate(14px,-12px) rotate(5deg)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes blink{0%,44%,50%,100%{transform:scaleY(1)}47%{transform:scaleY(.1)}}
@keyframes tw{50%{opacity:.1}}
@media (prefers-reduced-motion:reduce){.em,.orb,.eye,.stars i{animation:none}}
</style>
</head>
<body>
<div class="stars" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></div>
<main>
<div class="em" aria-hidden="true"><svg viewBox="0 0 150 150" focusable="false">
<ellipse class="orb" cx="75" cy="75" rx="68" ry="26" fill="none" stroke="var(--ember)" stroke-opacity=".45" stroke-width="2" stroke-dasharray="5 8"/>
<g fill="var(--surf)" stroke="var(--ink2)" stroke-width="2"><rect x="14" y="60" width="34" height="30" rx="3"/><rect x="102" y="60" width="34" height="30" rx="3"/><rect x="48" y="48" width="54" height="54" rx="15"/></g>
<path d="M31 60v30M14 75h34M119 60v30M102 75h34" stroke="var(--ink2)" stroke-opacity=".55"/>
<circle class="eye" cx="75" cy="75" r="12" fill="var(--ember)"/><path d="M75 48V30" stroke="var(--ink2)" stroke-width="2"/><circle cx="75" cy="27" r="4" fill="var(--ember)"/></svg></div>
<h1>404</h1>
<p class="sub">LOST SIGNAL</p>
<p class="msg">This page is outside our orbit. The data and the map are safe at home.</p>

<nav aria-label="Quick links"><a href="https://komilovsg.github.io/firechronicle/#v=overview">Overview</a><a href="https://komilovsg.github.io/firechronicle/#v=map">Map</a><a href="https://komilovsg.github.io/firechronicle/#v=calendar">Calendar</a><a href="https://komilovsg.github.io/firechronicle/#v=data">Data &amp; Method</a></nav>
<footer>FireChronicle · Deep Space AI · Data: NASA FIRMS</footer>

</body>
</html>
