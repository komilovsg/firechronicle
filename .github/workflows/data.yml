name: daily data refresh

# Every day: pull the latest NASA FIRMS detections, re-harmonize, test, and redeploy the site.
# History is read from the live site (no data commits, the repo stays small); the code is not changed.
on:
  schedule:
    - cron: "0 3 * * *"   # 03:00 UTC = 08:00 Dushanbe, after the overnight and afternoon overpasses are in FIRMS
  workflow_dispatch:

permissions:
  contents: write
  actions: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  SITE: https://komilovsg.github.io/firechronicle
  AUTO_UPDATE_UNTIL: "2027-05-15"   # keep in sync with pipeline/build.py

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Stop after the scheduled end of automatic updates
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "$(date -u +%F)" > "$AUTO_UPDATE_UNTIL" ]]; then
            echo "Automatic updates ended on $AUTO_UPDATE_UNTIL; disabling this schedule."
            gh workflow disable data.yml -R "$GITHUB_REPOSITORY"
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install polars==1.31.0 numpy==2.2.6 h3==4.2.2 shapely==2.1.1 pytest==8.4.0

      - name: Pull the currently published data as history
        run: |
          set -euo pipefail
          cd web/public/data
          curl -fsS "$SITE/data/meta.json" -o meta.json
          for y in $(seq 2000 $(date -u +%Y)); do
            curl -fsS "$SITE/data/points/$y.csv.gz" -o "points/$y.csv.gz" || echo "no points for $y"
          done

      - name: Fetch the last 6 months from FIRMS (SP where available, NRT after)
        env:
          FIRMS_MAP_KEY: ${{ secrets.FIRMS_MAP_KEY }}
        run: python pipeline/fetch_firms.py recent

      - name: Re-harmonize
        run: python pipeline/build.py --points

      - run: python -m pytest -q pipeline

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm test
        working-directory: web
      - run: npm run build
        working-directory: web

      - name: Sanity check the new data before publishing
        run: |
          python - <<'EOF'
          import json, sys
          m = json.load(open("web/public/data/meta.json"))
          r = json.load(open("web/public/data/regions.json"))["regions"]
          ca = next(x for x in r if x["id"] == "central-asia")
          ok = m.get("sample") is False and len(ca["harm"]) == m["t_last"] - m["t_first"] + 1 and sum(ca["harm"]) > 100000
          print("data through", m["data_through"], "ok" if ok else "FAILED")
          sys.exit(0 if ok else 1)
          EOF

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

      - name: Weekly keepalive commit (GitHub disables schedules after 60 days without activity)
        run: |
          set -euo pipefail
          last=$(git log -1 --format=%ct)
          if [ $(( $(date -u +%s) - last )) -gt 604800 ]; then
            mkdir -p data
            date -u +%Y-%m-%dT%H:%M:%SZ > data/last_refresh.txt
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/last_refresh.txt
            git commit -m "record data refresh"
            git push
          fi

  deploy:
    needs: refresh
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
